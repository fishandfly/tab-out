<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#233d40">
<meta name="description" content="山息 · 自然漫游">
<title>山息 · 自然漫游</title>
<link rel="stylesheet" href="style.css">
</head>
</head>
<body data-mode="cover" data-ready="false">
<svg xmlns="http://www.w3.org/2000/svg" class="defs" aria-hidden="true">
<defs>
<symbol id="i-mark" viewBox="0 0 48 38"><g fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M2 30 14 14l4 4L28 5l17 25M8 30l6-8 5 6L29 13l11 17M2 35c9-4 15 3 24-1 7-3 13-2 19-1"/></g></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-7-7 7 7-7 7"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m3 5 6-2 6 3 6-2v15l-6 2-6-3-6 2zm6-2v15m6-12v15"/></symbol>
<symbol id="i-audio" viewBox="0 0 24 24"><path d="M3 10h4l5-4v12l-5-4H3zm13-2c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 10h4l5-4v12l-5-4H3zm13 0 5 5m0-5-5 5"/></symbol>
<symbol id="i-tune" viewBox="0 0 24 24"><path d="M3 7h8m4 0h6m-18 10h3m4 0h11"/><circle cx="13" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="i-sit" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="m5 15 4-3 2-4h2l2 4 4 3m-9 0-5 3c-2 2 2 3 7 1 5 2 9 1 7-1l-5-3"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M20 4l-2 2M6 18l-2 2"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.4"/></symbol>
<symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></symbol>
<symbol id="i-saver" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="m6.5 15 3.5-4 2.5 2.5 2.5-3L18.5 15M9 22h6"/></symbol>
<symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3c1 4-3 4-3 8-2-1-2-3-2-3-3 5-1 8 4 8 5 0 8-5 3-9 0 2-1 3-2 3 1-3 1-5 0-7Zm-4 14 6 1m-5-.7 1 5m3-4.5-1 4.5"/></symbol>
<symbol id="i-glide" viewBox="0 0 24 24"><path d="m2 14 10-9 10 9-9-2-1 4-1-4z"/></symbol>
<symbol id="i-wind" viewBox="0 0 24 24"><path d="M2 9h12c5 0 4-6 1-6m-13 10h17c4 0 4-5 1-5M4 17h9c4 0 4 5 1 5"/></symbol>
</defs></svg>
<canvas id="world" aria-label="可漫游的三维自然风景" tabindex="-1"></canvas>
<div class="veil"></div>
<header class="cover-head">
  <div class="wordmark"><svg class="mark"><use href="#i-mark"/></svg><span>自然漫游</span></div>
  <div class="cover-utilities">
    <button type="button" class="glass cover-fullscreen" id="cover-fullscreen" data-action="fullscreen" aria-keyshortcuts="Shift+F" title="全屏 Shift + F"><svg class="icon" aria-hidden="true"><use href="#i-fullscreen"/></svg><span data-fullscreen-label>全屏</span></button>
    <button id="cover-audio" class="glass round" aria-label="开启声音" title="声音"><svg class="icon"><use href="#i-mute"/></svg></button>
  </div>
  <aside id="author-support" hidden></aside>
</header>
<main id="cover">
  <div class="cover-inner"><div class="roman"><i></i> MOUNTAIN BREATH</div>
  <h1>山息</h1><p id="cover-sub">在山与水之间，按自己的步调走。</p>
  <div class="cover-actions">
    <button id="enter" class="primary" disabled><span>正在生成山野</span><svg class="icon"><use href="#i-arrow"/></svg></button>
    <div class="cover-secondary">
      <button type="button" id="saver-start" class="text-button" disabled><svg class="icon" aria-hidden="true"><use href="#i-saver"/></svg>动态屏保</button>
      <button id="atlas-cover" class="text-button" disabled><svg class="icon"><use href="#i-map"/></svg>展开山图</button>
    </div>
  </div></div>
  <div class="caption"><div class="cap-line"></div><span id="cover-place">听岚湖</span><small id="cover-climate"></small></div>
</main>
<div id="trail-bearing" hidden><i aria-hidden="true">↑</i><span></span></div>
<div id="hud" class="hud">
  <div class="hud-location"><svg class="mini"><use href="#i-pin"/></svg><span id="place-now"></span></div>
  <nav class="tools" aria-label="漫游工具">
    <button data-action="atlas" aria-label="山图与图志 M" title="山图与图志 M"><svg class="icon"><use href="#i-map"/></svg></button>
    <button data-action="sit" aria-label="静坐 C" title="静坐 C"><svg class="icon"><use href="#i-sit"/></svg></button>
    <button data-action="fly" aria-label="漂浮 F" title="漂浮 F"><svg class="icon"><use href="#i-wind"/></svg></button>
    <button data-action="dive" hidden aria-label="潜入水中 V" title="潜入水中 V"><svg class="icon" viewBox="0 0 24 24"><path d="M2 8q2.5-2 5 0t5 0t5 0t5 0M12 11v9m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button data-action="photo" aria-label="保存风景 P" title="保存风景 P"><svg class="icon"><use href="#i-camera"/></svg></button>
    <button data-action="clean" aria-label="纯净画面 H" title="纯净画面 H"><svg class="icon"><use href="#i-eye"/></svg></button>
    <button data-action="settings" aria-label="漫游设置 Esc" title="漫游设置 Esc"><svg class="icon"><use href="#i-tune"/></svg></button>
  </nav>
</div>
<button type="button" id="torch-action" class="glide-action" data-action="torch" hidden><svg class="icon"><use href="#i-fire"/></svg><span>点燃壁炬</span><kbd>E</kbd></button>
<button id="glide-action" class="glide-action" data-action="glide" hidden><svg class="icon"><use href="#i-glide"/></svg><span>展开滑翔翼</span><kbd>G</kbd></button>
<div id="intro" class="intro"></div>
<div id="touch-controls"><div id="stick" role="group" aria-label="移动摇杆"><i></i></div><div id="lift"><button data-lift="1" aria-label="升高">↑</button><button data-lift="-1" aria-label="降低">↓</button></div></div>
<div id="flash"></div><output id="status" aria-live="polite"></output>
<div id="shade" hidden></div>
<section class="panel atlas-panel" id="atlas" role="dialog" aria-modal="true" aria-labelledby="atlas-title" hidden>
  <div class="panel-head"><div><div class="eyebrow">FIELD ATLAS</div><h2 id="atlas-title">听岚山图</h2></div><button class="close" aria-label="收起山图"><svg class="icon"><use href="#i-close"/></svg></button></div>
  <nav class="map-views" aria-label="选择地图"><button type="button" id="trail-view" aria-pressed="true" aria-controls="trail-sheet">寻翼山径</button><button type="button" id="world-view" aria-pressed="false" aria-controls="world-sheet">全境图志</button><button type="button" id="waymark-view" aria-pressed="false" aria-controls="world-sheet">我的路标</button></nav>
  <div id="trail-sheet">
    <div class="trail-frame"><canvas id="trail-map" role="img" aria-label="从听岚湖到峰顶滑翔翼的步道与真实地形"></canvas><span class="trail-north" aria-hidden="true">北<i></i></span><span class="trail-scale" aria-hidden="true"><i></i><span></span></span></div>
    <div class="trail-key"><span><i class="map-player"></i>你的位置</span><span><i class="map-path"></i>徒步山径</span><span><svg class="mini"><use href="#i-glide"/></svg>滑翔翼</span></div>
    <div class="trail-foot"><div><h3 id="trail-next">从听岚湖出发</h3><p id="trail-caption"></p></div><button type="button" id="trail-guide" class="ink-button"><span>循径寻翼</span><svg class="icon"><use href="#i-arrow"/></svg></button></div>
  </div>
  <div id="world-sheet" hidden>
  <div class="atlas-body"><div id="map-frame"><canvas id="map" aria-label="山野地形及观景点分布图"></canvas><div class="north">北<span>↑</span></div><div id="waymark-map-key" hidden><span class="trail-scale"><i></i><span></span></span><span class="waymark-legend"><i class="map-player"></i>你的位置<i class="waymark-diamond"></i>路标</span></div></div><div id="places" aria-label="观景地点"></div>
    <div id="waymark-records" hidden>
      <form id="waymark-form"><label for="waymark-name">记下脚下的风景</label><input id="waymark-name" type="text" maxlength="36" autocomplete="off" placeholder="路标名称"><button type="submit" class="ink-button">标记当前位置</button></form>
      <div id="waymark-list" aria-label="已记下的路标"></div>
      <div id="waymark-notice" aria-live="polite"><span></span><button type="button" id="waymark-undo" hidden>撤销</button></div>
    </div></div>
  <div id="world-destination" class="atlas-foot"><div><h3 id="chosen-name"></h3><p id="chosen-desc"></p><label class="switch visit-light"><input id="best-light" type="checkbox" checked><span id="best-light-label"></span></label></div><button id="travel" class="ink-button"><span id="travel-label">去这里</span> <svg class="icon"><use href="#i-arrow"/></svg></button></div>
  <div id="waymark-foot" class="atlas-foot" hidden>
    <div><h3 id="waymark-title"></h3><p id="waymark-bounds"></p></div>
    <div id="waymark-actions"><button id="waymark-remove" type="button" class="link-button">移除</button><button type="button" id="waymark-travel" class="waymark-back">回到此处</button><button id="waymark-guide" type="button" class="ink-button" aria-pressed="false">开启寻向</button></div>
  </div>
  </div>
</section>
<section id="settings" class="panel settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
 <div class="panel-head"><div><div class="eyebrow">FIELD NOTES</div><h2 id="settings-title">漫游设置</h2></div><button class="close" aria-label="关闭设置"><svg class="icon"><use href="#i-close"/></svg></button></div>
 <div class="settings-body">
  <div class="section-line"><h3>天光与季候</h3><label class="switch"><input id="cycle" type="checkbox" checked> 自然流转</label></div>
  <label class="control-row">昼夜节奏<select id="clock-pace" aria-describedby="clock-notes"><option value="roam">漫游 · 24 分钟一天</option><option value="linger">细赏 · 48 分钟一天</option><option value="swift">快览 · 6 分钟一天</option></select></label>
  <label class="range-row">时刻 <input id="hour" type="range" min="0" max="23.99" step="0.02"><output id="hour-label"></output></label>
  <div class="control-row"><span>季节</span><div id="seasons" class="choices"><button data-season="0">春</button><button data-season="1">夏</button><button data-season="2">秋</button><button data-season="3">冬</button></div></div>
  <p id="clock-notes" class="clock-notes"></p>
  <label class="control-row">天气<select id="weather"><option value="auto">随风变化</option><option value="clear">晴朗</option><option value="mist">薄雾</option><option value="rain">雨雪</option></select></label>
  <div class="section-line"><h3>山野之声</h3><button id="settings-audio" class="link-button">开启声音</button></div>
  <label class="range-row">自然声 <input id="ambience" type="range" min="0" max="1" step=".01"><span>环境</span></label>
  <label class="range-row">配乐 <input id="music" type="range" min="0" max="1" step=".01"><span>器乐</span></label>
  <div class="section-line"><h3>镜头与画面</h3></div>
  <div class="control-row"><span>观景模式</span><div class="settings-view-actions">
    <button type="button" id="saver-settings" class="link-button" disabled>动态屏保</button>
    <button type="button" id="settings-fullscreen" class="link-button" data-action="fullscreen" aria-keyshortcuts="Shift+F" title="全屏 Shift + F"><span data-fullscreen-label>全屏</span></button>
  </div></div>
  <label class="control-row">画质<select id="quality"><option value="auto">自适应</option><option value="low">轻量</option><option value="high">精细</option></select></label>
  <label class="control-row"><span>反转鼠标左右</span><span class="switch"><input id="invert-mouse-x" type="checkbox"></span></label>
  <label class="control-row"><span>反转鼠标上下</span><span class="switch"><input id="invert-mouse-y" type="checkbox"></span></label>
  <label class="control-row">照片构图<select id="crop"><option value="view">原始视野</option><option value="wide">宽银幕 · 2.39∶1</option><option value="classic">经典 · 3∶2</option></select></label>
  <label class="control-row"><span>照片保留身体</span><span class="switch"><input id="photo-body" type="checkbox"></span></label>
  <details><summary>操作方式</summary><p id="help-text"></p></details>
 </div><button id="resume" class="ink-button wide">返回山野 <svg class="icon"><use href="#i-arrow"/></svg></button>
</section>
<div id="saver-curtain" aria-hidden="true"></div>
<div id="saver-interface">
  <nav class="saver-controls" aria-label="动态屏保操作">
    <button type="button" id="saver-sound" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-mute"/></svg><span>开启声音</span></button>
    <button type="button" id="saver-fullscreen" data-action="fullscreen" aria-keyshortcuts="Shift+F" title="全屏 Shift + F"><svg class="icon" aria-hidden="true"><use href="#i-fullscreen"/></svg><span data-fullscreen-label>全屏</span></button>
    <button type="button" id="saver-exit" aria-keyshortcuts="Escape"><span>退出屏保</span><kbd aria-hidden="true">Esc</kbd></button>
  </nav>
  <output id="saver-status" aria-live="polite"></output>
</div>
<div id="error" role="alert" hidden><h2>山野暂未打开</h2><p></p><button onclick="location.reload()">重新进入</button></div>
<noscript>需要开启 JavaScript 才能生成山野。</noscript>
<script src="app.js"></script>
</body>
</html>
